name: GitHub Pages

# Builds the game from source and publishes docs/ plus the fresh qixy.prg /
# qixy.d64 as the project site. Requires Settings -> Pages -> Source =
# "GitHub Actions" (one-time).

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (acme assembler + VICE for c1541)
        run: sudo apt-get update && sudo apt-get install -y acme vice

      # Optional: the D64 ships the crunched build when exomizer is available,
      # otherwise the Makefile falls back to the raw .prg.
      - name: Install exomizer (optional)
        run: sudo apt-get install -y exomizer || echo "exomizer not available; disk will carry the raw .prg"

      - name: Build PRG and D64
        run: make clean && make disk   # clean: the committed .prg has a fresh checkout timestamp

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp qixy.prg qixy.d64 _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
